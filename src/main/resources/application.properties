spring.application.name=pedidos-service
# H2 en memoria. MODE=LEGACY habilita CALL IDENTITY(), usado por el codigo para obtener el id generado
spring.datasource.url=jdbc:h2:mem:tienda;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
